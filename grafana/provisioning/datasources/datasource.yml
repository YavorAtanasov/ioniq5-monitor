apiVersion: 1

datasources:
  - name: InfluxDB-Ioniq5
    uid: influxdb-ioniq5
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token ${INFLUX_TOKEN}
    isDefault: true
    editable: true
