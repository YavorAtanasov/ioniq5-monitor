# The hosted side of the product: ingest + query API and its database.
# This runs on your infrastructure, not the vehicle owner's - their agent
# (docker-compose.yml) keeps the Bluelink credentials and pushes readings here.
services:
  postgres:
    image: postgres:16
    container_name: ioniq5-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ioniq5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ioniq5}
      POSTGRES_DB: ${POSTGRES_DB:-ioniq5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioniq5}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cloud-postgres-data:/var/lib/postgresql/data

  api:
    build: ./cloud
    container_name: ioniq5-cloud-api
    restart: unless-stopped
    env_file:
      - cloud/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cloud-postgres-data:
