name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL SARIF results to GitHub Security tab
      security-events: write
      # Required for fetching repo content
      contents: read
      # Required if analyzing actions/workflows (optional for pure Python)
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v2

